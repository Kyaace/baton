[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "baton"
version = "0.1.0"
description = "Dual-Speed Deterministic Orchestrator & Autonomous Copilot for Local LLMs"
authors = [{ name = "Baton Contributors" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31.0",
    "prompt-toolkit>=3.0.40",
    "rich>=13.7.0",
    "textual>=0.70.0",
    "beautifulsoup4>=4.12.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "anyio>=4.0.0",
]

[project.scripts]
baton = "baton.cli:main"

[tool.pytest.ini_options]
testpaths = ["baton/tests"]
